<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Design System</title>
<link rel="stylesheet" href="../src/styles/components.css">
</head><body>
<header class="ui-hdr"><img src="../public/brand/logo.svg" alt=""><div class="ui-brand"><b>آپادانا کاوش ایرانیان</b><small>نمایش سیستم طراحی</small></div><div class="ui-sp"></div><a class="ui-me" href="#"><span class="av"></span><span><b>نمونه کاربر</b><small>مدیر سیستم</small></span></a></header>
<div class="ui-app">
<aside class="sb"><a class="sb-top" href="#"><span class="ico">⌂</span>داشبورد</a>
<div class="sb-group"><button class="sb-item open"><span class="ico">🎨</span><span class="label">سیستم طراحی</span><span class="chev">‹</span></button>
<ul class="sb-sub"><li><a class="on" href="#"><span class="chev">‹</span>نمایش کامپوننت‌ها</a></li><li><a href="#"><span class="chev">‹</span>توکن‌ها</a></li></ul></div>
<div class="sb-group"><button class="sb-item"><span class="ico">☕</span><span class="label">کافی‌شاپ</span><span class="chev">‹</span></button></div></aside>
<main>
<section class="ui-card"><h3>دکمه‌ها</h3><button class="ui-btn primary">ثبت</button> <button class="ui-btn">انصراف</button> <button class="ui-btn danger">حذف</button> <button class="ui-btn sm">کوچک</button> <button class="ui-btn" disabled>غیرفعال</button></section>
<section class="ui-card"><h3>ورودی‌ها</h3><label class="ui-label">کد پرسنلی</label><div class="ui-field"><input placeholder="۱۰۴۵۶"></div><label class="ui-label">رمز عبور</label><div class="ui-field err"><input type="password"></div><div class="ui-msg">رمز عبور اشتباه است</div></section>
<section class="ui-card"><h3>شاخص‌ها و برچسب‌ها</h3><div class="ui-kpis"><div class="ui-kpi"><small>ورود موفق</small><b>۳۸۴</b></div><div class="ui-kpi"><small>ورود ناموفق</small><b>۱۲</b></div></div><p><span class="ui-badge">عادی</span> <span class="ui-badge ok">موفق</span> <span class="ui-badge warn">قفل شد</span> <span class="ui-badge info">ثبت شد</span></p></section>
<section class="ui-card"><h3>جدول</h3><table class="ui-table"><thead><tr><th>کاربر</th><th>رخداد</th><th>نتیجه</th></tr></thead><tbody><tr><td>رضا حسینی</td><td>ورود</td><td><span class="ui-badge ok">موفق</span></td></tr></tbody></table></section>
<div class="ui-note">داده‌های این صفحه نمونه هستند.</div>
</main></div></body></html>
